name: CodeQL (code scanning)

# Analiză statică de securitate pe COD (nu pe dependenţe — alea le acoperă dependabot.yml +
# security-scan.yml). Găseşte injecţii, path traversal, deserializări nesigure etc. în Python
# (gateway + agent) şi TS/JS (frontend). Rezultatele apar în tab-ul Security → Code scanning.
# Rulează pe push/PR în main + un scan săptămânal (prinde reguli noi pe cod neschimbat).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'   # luni, 05:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # publică rezultatele în tab-ul Security
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Limbaje interpretate → fără build; CodeQL extrage direct. Fixate pe SHA ca restul
      # acţiunilor (v4 = runtime Node 24; v3 rula pe Node 20, depreciat pe runnere din 2025-09).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended`, nu `security-and-quality`: vrem o POARTĂ de securitate cu recall
          # mare, nu sutele de note de stil/mentenanţă (variabile nefolosite, complexitate…) pe care
          # le adaugă suita „-and-quality" — acelea îngropau alertele care chiar contează. Calitatea
          # e deja acoperită de ruff (Python) + eslint/tsc (frontend).
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
