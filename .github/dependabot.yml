version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    # Salturile de versiune MAJORĂ sunt muncă deliberată (typescript 7, tailwind 4, eslint 10,
    # python 3.14, websockets 17 — toate rup ceva şi cer testare), nu ceva ce se merge-uiază
    # dintr-un PR automat. Le oprim aici, nu prin comentarii pe PR: la actualizările de GRUP
    # comanda `@dependabot ignore this major version` e ambiguă (grupul are mai multe
    # dependenţe) şi botul n-o aplică.
    #
    # Ce NU se pierde: patch-urile şi minorele continuă să vină, adică exact traseul pe care
    # sosesc reparaţiile de securitate. Ce se pierde: nu mai eşti anunţat singur când apare un
    # major. De reevaluat la 2.1 — scoţi blocul ăsta, laşi PR-urile să apară, le faci pe rând.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      pip-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Salturile de versiune MAJORĂ sunt muncă deliberată (typescript 7, tailwind 4, eslint 10,
    # python 3.14, websockets 17 — toate rup ceva şi cer testare), nu ceva ce se merge-uiază
    # dintr-un PR automat. Le oprim aici, nu prin comentarii pe PR: la actualizările de GRUP
    # comanda `@dependabot ignore this major version` e ambiguă (grupul are mai multe
    # dependenţe) şi botul n-o aplică.
    #
    # Ce NU se pierde: patch-urile şi minorele continuă să vină, adică exact traseul pe care
    # sosesc reparaţiile de securitate. Ce se pierde: nu mai eşti anunţat singur când apare un
    # major. De reevaluat la 2.1 — scoţi blocul ăsta, laşi PR-urile să apară, le faci pe rând.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  # `docker` acoperă DOCKERFILE-ul. Compose-urile au nevoie de ecosistemul lor, altfel
  # imaginile de acolo (traefik, socket-proxy, caddy) derivă fără ca nimeni să le revizuiască
  # — exact ce s-a întâmplat: erau pe tag-uri mutabile în timp ce Dockerfile-ul îşi declara
  # politica de pinning pe digest.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # Salturile de versiune MAJORĂ sunt muncă deliberată (typescript 7, tailwind 4, eslint 10,
    # python 3.14, websockets 17 — toate rup ceva şi cer testare), nu ceva ce se merge-uiază
    # dintr-un PR automat. Le oprim aici, nu prin comentarii pe PR: la actualizările de GRUP
    # comanda `@dependabot ignore this major version` e ambiguă (grupul are mai multe
    # dependenţe) şi botul n-o aplică.
    #
    # Ce NU se pierde: patch-urile şi minorele continuă să vină, adică exact traseul pe care
    # sosesc reparaţiile de securitate. Ce se pierde: nu mai eşti anunţat singur când apare un
    # major. De reevaluat la 2.1 — scoţi blocul ăsta, laşi PR-urile să apară, le faci pe rând.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # …şi NICIODATĂ imaginea noastră: pinul e legat de `GATEWAY_VERSION` printr-o poartă
      # în CI, deci un bump automat ar rupe build-ul. Se schimbă la release, nu de un bot.
      # (Pica şi cu `private_source_authentication_failure`, fiindcă pachetul ghcr e privat —
      # dar asta era simptomul, nu problema.)
      - dependency-name: "ghcr.io/*/webterm"
    groups:
      compose-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Salturile de versiune MAJORĂ sunt muncă deliberată (typescript 7, tailwind 4, eslint 10,
    # python 3.14, websockets 17 — toate rup ceva şi cer testare), nu ceva ce se merge-uiază
    # dintr-un PR automat. Le oprim aici, nu prin comentarii pe PR: la actualizările de GRUP
    # comanda `@dependabot ignore this major version` e ambiguă (grupul are mai multe
    # dependenţe) şi botul n-o aplică.
    #
    # Ce NU se pierde: patch-urile şi minorele continuă să vină, adică exact traseul pe care
    # sosesc reparaţiile de securitate. Ce se pierde: nu mai eşti anunţat singur când apare un
    # major. De reevaluat la 2.1 — scoţi blocul ăsta, laşi PR-urile să apară, le faci pe rând.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Salturile de versiune MAJORĂ sunt muncă deliberată (typescript 7, tailwind 4, eslint 10,
    # python 3.14, websockets 17 — toate rup ceva şi cer testare), nu ceva ce se merge-uiază
    # dintr-un PR automat. Le oprim aici, nu prin comentarii pe PR: la actualizările de GRUP
    # comanda `@dependabot ignore this major version` e ambiguă (grupul are mai multe
    # dependenţe) şi botul n-o aplică.
    #
    # Ce NU se pierde: patch-urile şi minorele continuă să vină, adică exact traseul pe care
    # sosesc reparaţiile de securitate. Ce se pierde: nu mai eşti anunţat singur când apare un
    # major. De reevaluat la 2.1 — scoţi blocul ăsta, laşi PR-urile să apară, le faci pe rând.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
