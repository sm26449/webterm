# Blueprint Authentik: preconfigurează integrarea WebTerm ca aplicaţie OIDC, cu valori CUNOSCUTE
# (client_id/secret, grup, user de test), ca stack-ul de referinţă să pornească gata legat.
#
# Ţinteşte linia Authentik 2026.8 (vezi docker-compose.yml), testat pe 2026.8.2. Câmpurile
# modelelor se mai schimbă între versiuni majore — dacă upgradezi Authentik şi blueprint-ul e
# respins, aliniază numele de câmpuri cu documentaţia versiunii tale (sau foloseşte provision.sh,
# care descoperă flow-urile/cheia/scope-urile dinamic).
#
# IMPORTANT (claimul `groups`): pentru ca `WEBTERM_OIDC_ALLOWED_GROUPS` să funcţioneze, tokenul
# trebuie să conţină `groups`. Legăm mai jos scope-mapping-ul standard „groups" al Authentik pe
# provider; dacă versiunea ta nu-l are, creează un property mapping care emite
# `return [g.name for g in request.user.ak_groups.all()]` pe cheia `groups`.
version: 1
metadata:
  name: webterm-sso
entries:
  # 3.6.5 — cele cinci grupuri implicite (ca provision.py): wt-access = doar login; wt-admins →
  # admin @ all; wt-readonly → viewer @ all; wt-db → operator @ tag:db; wt-network → operator @
  # tag:network (rolurile vin din WEBTERM_OIDC_ROLE_MAP în WebTerm, nu din Authentik).
  - model: authentik_core.group
    identifiers:
      name: wt-access
    attrs:
      name: wt-access

  - model: authentik_core.group
    identifiers:
      name: wt-admins
    attrs:
      name: wt-admins

  - model: authentik_core.group
    identifiers:
      name: wt-readonly
    attrs:
      name: wt-readonly

  - model: authentik_core.group
    identifiers:
      name: wt-db
    attrs:
      name: wt-db

  - model: authentik_core.group
    identifiers:
      name: wt-network
    attrs:
      name: wt-network

  # providerul OIDC (client confidenţial, PKCE acceptat)
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: webterm
    attrs:
      name: webterm
      client_type: confidential
      client_id: webterm-client-id
      client_secret: webterm-client-secret
      # redirect URI-ul WebTerm (trebuie să corespundă cu PUBLIC_URL + /api/oidc/callback).
      # Formatul listă-de-obiecte e cel din liniile Authentik ≥2024.4.
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:8000/api/oidc/callback"
      # 2026.8 cere grant_types explicit (altfel „Invalid grant_type" la authorize).
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # flow implicit-consent = cel prezent din start în liniile recente (explicit-consent nu mai
      # e creat by default). Pentru un stack de evaluare, fără ecran de consimţământ e chiar ok.
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        # NOTĂ: pentru claimul `groups` (necesar dacă vrei WEBTERM_OIDC_ALLOWED_GROUPS enforce-uit
        # ŞI în WebTerm) adaugă un scope mapping propriu care întoarce
        # `[g.name for g in request.user.ak_groups.all()]` pe cheia `groups`, apoi leagă-l aici.
        # În stack-ul de referinţă gating-ul se face prin politica `wt-groups` de mai jos (oricare
        # dintre cele cinci grupuri), iar WEBTERM_OIDC_ALLOWED_GROUPS e gol — merge fără claimul groups.

  # aplicaţia, legată de provider
  - model: authentik_core.application
    identifiers:
      slug: webterm
    attrs:
      name: WebTerm
      slug: webterm
      provider:
        !Find [authentik_providers_oauth2.oauth2provider, [name, webterm]]

  # 3.6.5: o politică de expresie `wt-groups` trece dacă userul e în ORICARE dintre cele cinci
  # grupuri; e legată de aplicaţie. Modul politicilor aplicaţiei NU e setat aici (implicit `any`
  # la o aplicaţie nouă) — într-un Authentik existent el decide ce alte binding-uri sunt
  # obligatorii. Aceeaşi logică ca provision.py.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: wt-groups
    attrs:
      name: wt-groups
      execution_logging: false
      expression: |
        # WebTerm: membru al ORICĂRUIA dintre grupurile WebTerm
        for name in ('wt-access', 'wt-admins', 'wt-readonly', 'wt-db', 'wt-network',):
            if ak_is_group_member(request.user, name=name):
                return True
        return False

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, webterm]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, wt-groups]]
      # 1, nu 0: un stack de referinţă mai vechi are deja binding-ul direct pe wt-access la 0
      # (un blueprint nu şterge intrările scoase; sub `any` cel vechi e oricum cuprins aici)
      order: 1
    attrs:
      enabled: true

  # user de test, în grup (parola: din blueprint, pentru E2E)
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      username: alice
      name: Alice Test
      email: alice@example.com
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, wt-access]]
      password: "alice-test-pass-1234"
