# Config gitleaks pentru WebTerm. Extinde regulile default + un allowlist pentru fixtures de
# TEST (parole/tokenuri dummy din scripturile de CI/e2e și vectorii RFC din teste) — NU secrete reale.
title = "WebTerm gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Fixtures de test — parole/tokenuri dummy + vectori RFC, nu secrete reale"
regexes = [
  # parola contului de test folosită de scripturile e2e/CI (fs-test, fwd-test, e2e-session,
  # e2e-backup/restore/features, …). Familia `parola-e2e-<ceva>-123456` — toate fixture, nu secrete.
  '''parola-e2e-[a-z0-9-]+''',
  # parola contului de test din suitele hermetice (web_sessions, agent_uninstall, csrf…)
  '''parola-de-test-1234''',
  # tokenuri de setup de test
  '''ci-e2e-token''',
  '''test-setup''',
  # fixture-uri SSO/OIDC: parola user-ului de test din blueprint-ul de evaluare (apare şi în
  # docs/SSO.md şi tests/oidc_test.py) + client_secret-ul DEMO al stack-ului de referinţă. Ambele
  # sunt valori cunoscute, publice, de laborator — nu secrete reale (provisionarea reală le generează).
  '''alice-test-pass-1234''',
  '''webterm-client-secret''',
]
paths = [
  # vectorii RFC 6238/8032 (hex) și fixture-urile din suita de teste
  '''tests/ed25519_kat_test\.py''',
  '''tests/totp_test\.py''',
  '''tests/signing_test\.py''',
]
