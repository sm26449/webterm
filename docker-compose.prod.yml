# Producție: imagine ghcr pre-construită + Traefik (SSL Let's Encrypt automat).
# Un singur secret de configurat — tokenul de setup al aplicației (în .env).
# Deploy:  ./deploy.sh   (sau: docker compose -f docker-compose.prod.yml up -d)
#
# Reutilizează volumul `webterm-data` al stack-ului implicit, deci datele
# (SQLite + transcripturi + cheie) se păstrează la trecerea de la Caddy la Traefik.

# Rotația logurilor Docker (json-file): fără ea, pe un server de terminal cu viață lungă
# logurile Traefik/app cresc nemărginit și umplu discul → coruperea WAL-ului SQLite la
# scriere. Aplicată la toate serviciile prin ancoră YAML.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Proxy minimal peste Docker API: expune DOAR citirea containerelor/rețelelor
  # către Traefik. Traefik (expus pe internet) nu mai atinge direct docker.sock,
  # deci un eventual compromis nu poate controla Docker-ul gazdei.
  dockerproxy:
    # Pinuit pe digest, ca Dockerfile-ul. Tag-ul rămâne în faţă doar ca etichetă lizibilă:
    # el se poate muta sub tine, digest-ul nu. Dependabot îl ridică la nevoie.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: 1        # citirea etichetelor pentru descoperirea rutelor
      NETWORKS: 1
      POST: 0              # niciun apel de scriere spre Docker
      SERVICES: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  traefik:
    # v3.6+ negociază versiunea de API cu Docker. Versiunile ≤3.5 cer fix API 1.24,
    # pe care Docker Engine ≥28 o refuză (MinAPIVersion 1.40) — Traefik nu mai vede
    # niciun container, deci nicio rută (404) și niciun certificat cerut.
    # Pinuit pe digest, ca Dockerfile-ul. Tag-ul rămâne în faţă doar ca etichetă lizibilă:
    # el se poate muta sub tine, digest-ul nu. Dependabot îl ridică la nevoie.
    image: traefik:v3.7@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    restart: unless-stopped
    logging: *default-logging
    depends_on: [dockerproxy]
    environment:
      # token Cloudflare scoped Zone:DNS:Edit pe zona domeniului
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://dockerproxy:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # sesiunile de terminal pot fi inactive mult timp — nu tăia WebSocket-ul
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=3600s
      # DOUĂ căi spre Let's Encrypt. Amândouă sunt definite mereu; routerele aleg una prin
      # WEBTERM_CERT_RESOLVER. Traefik instanţiază providerul DNS abia când chiar cere un
      # certificat, deci `ledns` definit fără token nu deranjează (verificat, porneşte curat).
      #
      #   le    HTTP-01, IMPLICIT. Nu cere niciun provider DNS şi niciun cont undeva —
      #         doar ca domeniul să rezolve spre server şi portul 80 să fie accesibil din
      #         internet. Fără el, o instalare fără token Cloudflare nu putea obţine deloc
      #         certificat, deşi Let's Encrypt nu cere aşa ceva.
      #   ledns DNS-01 Cloudflare. Necesar dacă eşti în spatele proxy-ului CF sau prin NAT
      #         fără port 80, ŞI singurul care poate emite un WILDCARD — adică singurul care
      #         acoperă toate subdomeniile de forward cu un singur certificat.
      #
      # Pe HTTP-01 aplicaţia are TLS normal, dar FORWARD-URILE NU. Nu e o chestiune de viteză
      # sau de rată: routerul de forward e prins cu `HostRegexp`, iar ACME din Traefik derivă
      # numele de domeniu doar din `Host()`/`HostSNI()` — dintr-un regex nu are ce extrage, şi
      # nu există emitere „on-demand" după SNI. Fără eticheta de wildcard (care cere DNS-01),
      # routerul rămâne fără certificat şi subdomeniile de forward primesc certul implicit,
      # autosemnat, al lui Traefik: avertisment în browser, nu „prima încărcare mai lentă".
      # Comentariul de aici a susţinut varianta blândă până la verificarea în documentaţia
      # Traefik; `.env.prod.example` spunea de la început ce trebuie.
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.ledns.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.ledns.acme.storage=/letsencrypt/acme-dns.json
      - --certificatesresolvers.ledns.acme.dnschallenge=true
      - --certificatesresolvers.ledns.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.ledns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/letsencrypt
    networks: [webterm, internal]

  app:
    image: ${WEBTERM_IMAGE:-ghcr.io/sm26449/webterm:v2.0.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # rădăcină read-only; scrierile merg în volumul /data sau /tmp efemer (RAM)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      WEBTERM_PUBLIC_URL: https://${WEBTERM_DOMAIN}
      # the per-browser-WS backlog cap before a forced resync
      WEBTERM_CLIENT_BUFFER: ${WEBTERM_CLIENT_BUFFER:-}
      WEBTERM_SETUP_TOKEN: ${WEBTERM_SETUP_TOKEN:-}
      # so the app knows, and shows in the UI, which image it is running
      WEBTERM_IMAGE_REF: ${WEBTERM_IMAGE:-ghcr.io/sm26449/webterm:v2.0.3}
      # the "is there a new version?" check: 0 disables it entirely (overrides the UI switch)
      WEBTERM_UPDATE_CHECK: ${WEBTERM_UPDATE_CHECK:-1}
      # optional read-only token, only while the repo is private (empty = works on a public repo)
      WEBTERM_UPDATE_CHECK_TOKEN: ${WEBTERM_UPDATE_CHECK_TOKEN:-}
      # the command the UI DISPLAYS when a new version exists (it never runs it)
      WEBTERM_UPDATE_COMMAND: ${WEBTERM_UPDATE_COMMAND:-}
      # ── The rest of the variables documented in .env.prod.example ────────────────────
      # ALL of them used to be missing here: `config.py` read them, `.env.prod.example`
      # documented them as working, but the container never received them. An admin who set
      # SMTP or WEBTERM_TRUSTED_PROXY_CIDRS in .env believed something was enabled; in
      # reality it ran on defaults. Checked on a live instance: 22 of 28 variables were dead.
      # `env_file: .env` is deliberately NOT used — it would hand CF_DNS_API_TOKEN to the app
      # too, which today is seen ONLY by Traefik (a separation worth keeping).
      WEBTERM_UPDATE_REPO: ${WEBTERM_UPDATE_REPO:-}
      # alerts (SMTP + webhook). They can also be configured from the UI, which stores them in the DB.
      WEBTERM_SMTP_HOST: ${WEBTERM_SMTP_HOST:-}
      WEBTERM_SMTP_PORT: ${WEBTERM_SMTP_PORT:-587}
      WEBTERM_SMTP_USER: ${WEBTERM_SMTP_USER:-}
      WEBTERM_SMTP_PASSWORD: ${WEBTERM_SMTP_PASSWORD:-}
      WEBTERM_SMTP_STARTTLS: ${WEBTERM_SMTP_STARTTLS:-1}
      WEBTERM_ALERT_FROM: ${WEBTERM_ALERT_FROM:-}
      WEBTERM_ALERT_TO: ${WEBTERM_ALERT_TO:-}
      WEBTERM_ALERT_WEBHOOK: ${WEBTERM_ALERT_WEBHOOK:-}
      # security: who may set X-Forwarded-For, and how long sessions last
      WEBTERM_TRUSTED_PROXY_HOPS: ${WEBTERM_TRUSTED_PROXY_HOPS:-1}
      WEBTERM_TRUSTED_PROXY_CIDRS: ${WEBTERM_TRUSTED_PROXY_CIDRS:-}
      WEBTERM_TRUST_CF_IP: ${WEBTERM_TRUST_CF_IP:-}
      WEBTERM_IP_MAX_FAILS: ${WEBTERM_IP_MAX_FAILS:-5}
      WEBTERM_SESSION_TTL_DAYS: ${WEBTERM_SESSION_TTL_DAYS:-30}
      WEBTERM_SESSION_IDLE_HOURS: ${WEBTERM_SESSION_IDLE_HOURS:-12}
      WEBTERM_IDLE_LOCK_SECS: ${WEBTERM_IDLE_LOCK_SECS:-300}
      # retention and caps
      WEBTERM_ARCHIVE_DAYS: ${WEBTERM_ARCHIVE_DAYS:-120}
      WEBTERM_CLOSED_ARCHIVE_DAYS: ${WEBTERM_CLOSED_ARCHIVE_DAYS:-30}
      WEBTERM_AUDIT_DAYS: ${WEBTERM_AUDIT_DAYS:-120}
      WEBTERM_TRANSCRIPT_MAX_BYTES: ${WEBTERM_TRANSCRIPT_MAX_BYTES:-}
      WEBTERM_TRANSCRIPT_KEEP_BYTES: ${WEBTERM_TRANSCRIPT_KEEP_BYTES:-}
      # the domain forwards are opened on (defaults to the app's domain);
      # it can be overridden in Settings, and the infra (Traefik) follows via FORWARD_DOMAIN
      WEBTERM_FORWARD_DOMAIN: ${FORWARD_DOMAIN:-${WEBTERM_DOMAIN}}
    volumes:
      - webterm-data:/data
    networks: [webterm]
    labels:
      - traefik.enable=true
      - traefik.http.routers.webterm.rule=Host(`${WEBTERM_DOMAIN}`)
      - traefik.http.routers.webterm.entrypoints=websecure
      - traefik.http.routers.webterm.tls.certresolver=${WEBTERM_CERT_RESOLVER:-le}
      # certificat wildcard prin DNS-01: acoperă domeniul principal + toate
      # subdomeniile de forward (*.<domeniu>). Un singur cert, un singur resolver.
      # Wildcard-ul se cere DOAR pe DNS-01. Aici era necondiţionat, iar pe HTTP-01
      # Let's Encrypt refuză întreaga comandă („prober: could not determine solvers"):
      # ambele nume intră într-un singur ordin SAN, deci pică ŞI domeniul de bază, iar
      # instalarea implicită rămânea fără NICIUN certificat.
      #
      # Eticheta întreagă vine din variabilă, nu doar valoarea: `...domains[0].main=` cu
      # valoare goală NU înseamnă „fără listă", ci „un domeniu vid", şi Traefik răspunde
      # „no domain was given". Când nu cerem wildcard, variabilele colapsează într-o
      # etichetă inofensivă (aceeaşi `traefik.enable=true`, repetată), iar Traefik deduce
      # singur numele din regula `Host(...)` — exact ce vrem pe HTTP-01.
      - ${WEBTERM_CERT_LABEL_MAIN:-traefik.enable=true}
      - ${WEBTERM_CERT_LABEL_SANS:-traefik.enable=true}
      - traefik.http.services.webterm.loadbalancer.server.port=8000
      - traefik.http.routers.webterm.middlewares=webterm-hsts@docker
      - traefik.http.middlewares.webterm-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.webterm-hsts.headers.stsIncludeSubdomains=true
      # Port forwarding: orice <slug>.<domeniu-forward> ajunge la ACEEAȘI aplicație,
      # care face handshake-ul de auth (redirect→token→cookie) + proxy prin tunelul
      # agentului. App-ul re-validează Host-ul față de sufixul exact al domeniului și
      # de slug-urile declarate (defense-in-depth peste regexul de rutare).
      # FORWARD_DOMAIN implicit = WEBTERM_DOMAIN (forward-urile pe același domeniu ca
      # app-ul); setează-l în .env ca să folosești alt domeniu — Traefik îi emite un
      # cert wildcard propriu prin același resolver DNS-01.
      - traefik.http.routers.webterm-fwd.rule=HostRegexp(`^[a-z0-9-]+\.${FORWARD_DOMAIN:-${WEBTERM_DOMAIN}}$`)
      - traefik.http.routers.webterm-fwd.entrypoints=websecure
      - traefik.http.routers.webterm-fwd.tls.certresolver=${WEBTERM_CERT_RESOLVER:-le}
      # Wildcard-ul se cere DOAR pe DNS-01: HTTP-01 nu poate emite `*.domeniu`, iar cererea
      # ar eşua în buclă. Pe HTTP-01 lăsăm gol, şi fiecare subdomeniu îşi ia certul la prima
      # accesare. Variabilele sunt scrise de deploy.sh/install.sh după cum ai token CF sau nu.
      # Routerul de forward foloseşte `HostRegexp`, din care Traefik nu poate deduce niciun
      # nume — deci fără `tls.domains` explicit nu poate cere nimic. Pe HTTP-01 nu există
      # variantă: un wildcard nu se poate emite aşa. Vezi nota din README: forward-urile pe
      # subdomenii cer un token Cloudflare (DNS-01).
      - ${WEBTERM_CERT_LABEL_FWD_MAIN:-traefik.enable=true}
      - ${WEBTERM_CERT_LABEL_FWD_SANS:-traefik.enable=true}
      - traefik.http.routers.webterm-fwd.service=webterm
      - traefik.http.routers.webterm-fwd.middlewares=webterm-hsts@docker

volumes:
  webterm-data:
  traefik-acme:

networks:
  webterm:
  # fără acces la exterior: doar Traefik ↔ dockerproxy
  internal:
    internal: true
